# Slack app manifest for the Google Chat migration tooling.
#
# Create the app from this file rather than clicking through the scope list:
#   https://api.slack.com/apps  →  Create New App  →  From a manifest
#
# Every scope here is read-only except files:write, chat:write and
# channels:join, which the post-import file uploader needs. Reinstalling the
# app after adding the user scopes issues a User OAuth Token (xoxp-) next to
# the bot token; store it as SLACK_USER_TOKEN or in the keyring as slack-user.
# Nothing in this app can delete a message, remove a member, or change
# anyone's profile.
#
# After the announcement, other people approve the app too (slack-connect),
# each through their own consent screen, so restore-reactions can add back
# the reactions they made in Google Chat. Their token can only act as them.
display_information:
  name: Chat Migration
  description: Reads the workspace for migration checks and attaches imported files.
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: Chat Migration
    always_online: false

oauth_config:
  redirect_urls:
    # slack-connect behind Tailscale Funnel; only up while people connect.
    - https://server.tail3620c0.ts.net:8443/slack/callback
  scopes:
    bot:
      # --- Pre-import mapping report: who already exists here, so the import
      # merges into them instead of creating duplicates.
      - users:read
      - users:read.email        # separate scope; without it every email is blank
      - team:read

      # --- Naming collisions: does a channel we are about to create exist?
      - channels:read
      - groups:read
      - im:read
      - mpim:read

      # --- Verification after the import: count messages per conversation.
      - channels:history
      - groups:history

      # --- Post-import file uploader: attach files to the messages that
      # referenced them. The bot must be in a channel to post there.
      - files:write
      - chat:write
      - channels:join

      # --- archive-channels: archive the public channels the manifest marks
      # for archiving (every Space when built with build-slack-archive
      # --archive-all-spaces) after the
      # import (the importer skips a channel the export marks archived).
      - channels:manage
    user:
      # --- A user token acts as the person who installs the app, and reaches
      # that person's own DMs and group DMs, which no bot token can. Used by
      # verify-slack to check them and by upload-files to attach files there.
      # It reaches nobody else's DMs.
      #
      # reactions:write and the channels:* pair are for restore-reactions:
      # each person re-adds their own reactions, in public channels too, and
      # chat:write lets an author tidy the text reaction line on their message.
      # groups:write lets archive-channels archive a private channel
      # with the token of someone in it (the bot cannot join private ones).
      - groups:write
      - reactions:write
      - channels:read
      - channels:history
      - im:read
      - im:history
      - mpim:read
      - mpim:history
      - groups:read
      - groups:history
      - files:write
      - chat:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
